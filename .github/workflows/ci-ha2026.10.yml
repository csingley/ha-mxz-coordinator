name: HA 2026.10 qualification

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval:
    name: first-time contributor approval admission
    # GitHub runs an approved first-time-contributor PR run as attempt 2; attempt 1
    # is a zero-job placeholder held at action_required. Admit exactly that shape
    # and nothing else: an ordinary re-run (attempt 1 executed jobs) stays refused.
    if: ${{ github.run_attempt == 2 && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      admitted: ${{ steps.check.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attempt 1 was only held for approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_approval_admission.py

  exact-ha202610:
    name: Python 3.14.8 / HA 2026.10.0 / generated plugin
    needs: approval
    # Runs on attempt 1 with approval skipped; any other attempt meets the guard below.
    if: ${{ !cancelled() }}
    env:
      APPROVAL_ADMITTED: ${{ needs.approval.outputs.admitted }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Public hosted source boundary
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          refuse() { echo "HA202610_REFUSED=$1" >&2; exit 1; }
          test "${REPOSITORY_PRIVATE:-}" = false || refuse repository
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || refuse runner
          test "${RUNNER_ARCH:-}" = X64 || refuse architecture
          test -n "${ImageOS:-}" || refuse image
          test "${GITHUB_RUN_ATTEMPT:-}" = 1 || { test "${GITHUB_RUN_ATTEMPT:-}" = 2 && test "${GITHUB_EVENT_NAME:-}" = pull_request && test "${APPROVAL_ADMITTED:-}" = true; } || refuse attempt
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || refuse source
          case "${GITHUB_EVENT_NAME:-}:${GITHUB_REF:-}" in
            push:refs/heads/*|workflow_dispatch:refs/heads/*) ;;
            pull_request:refs/pull/*/merge)
              test -n "${GITHUB_HEAD_REF:-}" && test -n "${GITHUB_BASE_REF:-}" || refuse pull-request ;;
            *) refuse event ;;
          esac
          for ref in "${GITHUB_REF#refs/heads/}" "${GITHUB_HEAD_REF:-}" "${GITHUB_BASE_REF:-}"; do
            case "$ref" in
              ci/issue25-discriminator|ci/issue25-independent-repeat|ci/issue25-harness-admission|ci/issue25-harness-replacement|ci/issue25-harness-repeat) refuse diagnostic-ref ;;
            esac
          done
          . /etc/os-release
          test "${ID:-}:${VERSION_ID:-}" = ubuntu:26.04 || refuse os
          test -n "${ImageVersion:-}" || refuse image-version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact public source and artifact setup
        run: bash tools/ci-ha202610.sh setup
      - name: Additional lane controls
        run: bash tools/ci-ha202610.sh checks
      - name: Ordinary admission sentinel
        run: bash tools/ci-ha202610.sh sentinel
      - name: Full retained suite with original phases
        run: bash tools/ci-ha202610.sh suite
      - name: Full suite on a fresh-boot clock
        if: ${{ !cancelled() }}
        run: bash tools/ci-ha202610.sh fakeboot
      - name: Complete source, dependency, build and phase evidence
        if: always()
        run: bash tools/ci-ha202610.sh export
      # The same files the export reads, kept downloadable whether the run
      # passed, failed or timed out; upload needs no token permission.
      - name: Upload suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha202610-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/suite.log
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/suite.exit
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/fakeboot.log
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/fakeboot.exit
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/sentinel.log
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/sentinel.exit
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/checks.log
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/setup.log
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/runner.txt
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/source.txt
            ${{ runner.temp }}/ha202610-${{ github.run_id }}-a1/logs/*/receipt.json
